trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  AWS_REGION: 'us-east-1'

stages:

  - stage: PlanStage
    displayName: '📋 Init, Validate & Plan'
    jobs:
      - job: PlanJob
        steps:

          - script: |
              wget -q https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
              unzip terraform_1.7.5_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
              terraform version
            displayName: 'Install Terraform'

          - script: |
              export AWS_ACCESS_KEY_ID=$(AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(AWS_SECRET_ACCESS_KEY)
              export AWS_DEFAULT_REGION=$(AWS_REGION)

              terraform init
              terraform validate
              terraform plan -out=tfplan
            displayName: 'Init → Validate → Plan'

          - task: PublishPipelineArtifact@1
            displayName: 'Save plan artifact'
            inputs:
              targetPath: tfplan
              artifact: tfplan

  - stage: ApprovalStage
    displayName: '🔐 Manual Approval'
    dependsOn: PlanStage
    jobs:
      - job: WaitForApproval
        pool: server
        steps:
          - task: ManualValidation@0
            displayName: 'Approve to Apply'
            timeoutInMinutes: 60
            inputs:
              notifyUsers: 'iamhp34@gmail.com'
              instructions: 'Plan complete. Review Stage 1 logs then approve to create EC2.'

  - stage: ApplyStage
    displayName: '🚀 Terraform Apply'
    dependsOn: ApprovalStage
    jobs:
      - job: ApplyJob
        steps:

          - script: |
              wget -q https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
              unzip terraform_1.7.5_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: 'Install Terraform'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download plan artifact'
            inputs:
              artifact: tfplan
              path: $(System.DefaultWorkingDirectory)

          - script: |
              export AWS_ACCESS_KEY_ID=$(AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(AWS_SECRET_ACCESS_KEY)
              export AWS_DEFAULT_REGION=$(AWS_REGION)

              terraform init
              terraform apply -auto-approve tfplan
            displayName: 'Terraform Apply'

  - stage: DestroyStage
    displayName: '💣 Wait 5 min → Auto Destroy'
    dependsOn: ApplyStage
    condition: succeeded()
    jobs:
      - job: DestroyJob
        timeoutInMinutes: 15
        steps:

          - script: |
              wget -q https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
              unzip terraform_1.7.5_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
            displayName: 'Install Terraform'

          - script: |
              export AWS_ACCESS_KEY_ID=$(AWS_ACCESS_KEY_ID)
              export AWS_SECRET_ACCESS_KEY=$(AWS_SECRET_ACCESS_KEY)
              export AWS_DEFAULT_REGION=$(AWS_REGION)

              terraform init
              echo "EC2 is live. Waiting 5 minutes..."
              for i in 5 4 3 2 1; do
                echo "  Destroying in ${i} minute(s)..."
                sleep 60
              done
              echo "Destroying now..."
              terraform destroy -auto-approve
            displayName: 'Wait 5 min then Destroy'